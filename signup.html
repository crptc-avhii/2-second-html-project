<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
</head>

<body>

    <header>
        <h1>Create Your Account</h1>
        <p>Join us today! Fill in your details to get started.</p>
    </header>

    <main>

        <form action="#" method="post">

            <fieldset>

                <legend>Personal Information</legend>

                <br>

                <label for="fullname">Full Name:</label>
                <br>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

                <br><br>

                <label for="email">Email Address:</label>
                <br>
                <input type="email" id="email" name="email" placeholder="Enter your email" required
                    autocomplete="email">

                <br><br>

                <label for="phone">Phone Number:</label>
                <br>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" pattern="[0-9]{10}"
                    required>

                <br><br>

                <label for="dob">Date of Birth:</label>
                <br>
                <input type="date" id="dob" name="dob" required>

                <br><br>

                <label>Gender:</label>
                <br>

                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>

                <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label>

            </fieldset>

            <br>

            <fieldset>

                <legend>Account Information</legend>

                <br>

                <label for="username">Username:</label>
                <br>
                <input type="text" id="username" name="username" placeholder="Choose a username" required minlength="4">

                <br><br>

                <label for="password">Create Password:</label>
                <br>
                <input type="password" id="password" name="password" placeholder="Create a password" required
                    minlength="8" autocomplete="new-password">

                <br><br>

                <label for="confirm-password">Confirm Password:</label>
                <br>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password"
                    required minlength="8" autocomplete="new-password">

            </fieldset>

            <br>

            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">
                I agree to the Terms and Conditions.
            </label>

            <br><br>

            <button type="submit">Create Account</button>

            <button type="reset">Reset Form</button>

        </form>

        <p>
            Already have an account?
            <a href="login.html">Login Here</a>
        </p>

    </main>

    <footer>
        <hr>
        <p>2026 My Website. All Rights Reserved.</p>
    </footer>

</body>

</html>
